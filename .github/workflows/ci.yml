name: CI

on:
  push:
    # Branches only. A tag push points at a commit that has already been built, so
    # including tags ran the whole matrix a second time on the same code. The two
    # runs then competed for runners and one of them lost a timing-sensitive test
    # that the other passed, which reads as a flake and is really just self-inflicted
    # contention.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Never fetch a language server from a runner. Without this the chassis may try to
  # install one mid-test, which turns a code failure into a network failure.
  MINDWEAVE_NO_AUTO_INSTALL: "1"

jobs:
  # Windows only, deliberately. Mindweave targets Windows today; macOS and Linux are
  # planned and belong to contributors. Running them here reported a hang nobody was
  # working on, which says nothing about whether a change is good. Add those jobs back
  # alongside the work that makes them pass.
  windows:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    # A hung test step would otherwise hold a runner for GitHub's six hour default.
    #
    # This was 20, set when the whole job finished in under four minutes. The suite has
    # since grown past 2,100 tests, and two runs on 2026-08-26 were killed here at
    # exactly 20m00s with the test step still going. Measured at the time: 200s locally
    # on 8 cores, against a 4-core runner that had not finished after 19m30s.
    #
    # Raised to catch a genuine hang while letting a real run finish. If a job ever
    # approaches this again, find the cost rather than raising it: as measured,
    # backgroundShells.test.ts alone is ~130s of the local 200s, because it waits out
    # real startup and exit grace periods.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is current LTS. Both
        # run so a change needing a newer API fails here rather than for a user on
        # the minimum supported version.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Facts about the machine, as ANNOTATIONS so they can be read without admin
      # rights or a browser. Every wrong guess about why this build differs from a
      # developer's machine cost a round trip; these are the things that actually
      # differ (core count decides test concurrency, and ripgrep is the primary
      # search engine and is NOT on this image).
      - name: Environment facts
        shell: bash
        run: |
          rg_path=$(command -v rg || echo "NOT INSTALLED")
          echo "::notice title=Env::node=$(node -v) cores=$(node -p 'require("os").availableParallelism()') rg=${rg_path} tmp=${RUNNER_TEMP} os=${RUNNER_OS}"

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        # pipefail matters: without it `tee` decides the exit code and a failing
        # suite reports success.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # Search has TWO engines and picks one from what is installed, so a single run
      # only ever covers one of them. The runners have no ripgrep, so the suite above
      # is the built-in walker; this installs ripgrep and runs the search tests again
      # to cover the other path. The two drifted apart once already (only ripgrep
      # honoured .gitignore until v1.9.3) and nothing caught it, because no machine
      # ran both.
      - name: Test the ripgrep search path
        shell: bash
        run: |
          set -o pipefail
          choco install ripgrep -y --no-progress --limit-output
          rg --version
          node --import tsx --test \
            src/tools/tools.test.ts \
            src/tools/codeIntel.test.ts \
            src/tools/multiroot.test.ts 2>&1 | tee rg-output.txt

      # Failures as ANNOTATIONS, not only the run summary. The summary is rendered by
      # JavaScript and full logs need admin rights on the API, so neither can be read
      # from outside a browser. Annotations come back from the public checks API, and
      # that difference decides whether a red build can be diagnosed at all.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          while IFS= read -r line; do
            echo "::error title=Test failed::${line}"
          done < <(grep -E "^not ok " test-output.txt | head -25)
          while IFS= read -r line; do
            echo "::error title=Assertion::${line}"
          done < <(grep -E "^ +(AssertionError|Error|code|expected|actual|operator):" test-output.txt | head -30)
          counts=$(grep -E "^# (tests|pass|fail|skipped)" test-output.txt | tr '\n' ' ')
          echo "::error title=Suite totals::${counts:-suite produced no totals, it may have crashed}"
          {
            echo "## Failing tests"
            echo '```'
            grep -E "^not ok |^# (tests|pass|fail|skipped)" test-output.txt | head -80 || echo "(none found: the suite may have crashed before reporting)"
            echo '```'
            echo "### First assertions"
            echo '```'
            grep -A 12 -m 3 "^not ok " test-output.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
